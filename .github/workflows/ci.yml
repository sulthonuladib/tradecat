name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build userscripts
        run: bun run build
      - name: Unit tests
        run: bun test test/format.test.ts test/coininfo.test.ts test/site.test.ts
      - name: Typecheck
        run: bunx tsc --noEmit
      # ubuntu-latest routes `chromium-browser` to a snap that cannot reach the
      # store on CI runners, so install Chrome for Testing directly instead.
      - name: Install Chrome (for DOM tests)
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable
      - name: DOM tests
        run: bun run test/dom.test.mjs
        env:
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
