<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mexc.fm orderbook fixture</title>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var rate = params.get('rate');
    if (rate) {
      try {
        localStorage.setItem('tradecat:idr.rate', JSON.stringify(Number(rate)));
        localStorage.setItem('tradecat:idr.updatedAt', JSON.stringify(Date.now()));
        localStorage.setItem('tradecat:idr.source', JSON.stringify('fixture'));
      } catch (e) {}
    }
    window.__TRADECAT_SITE__ = params.get('site') || 'mexc';
  })();
</script>
<style>
  body { background: #121212; color: #eaecef; font: 12px/1.6 ui-sans-serif, sans-serif; }

  td { text-align: right; font-variant-numeric: tabular-nums; }
  .trades { margin-top: 40px; }
</style>
</head>
<body>
